name: Fix HomeScreen on rebrand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/prismtune
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore + patch HomeScreen
        run: |
          set -e
          HS=app/src/main/kotlin/com/metrolist/music/ui/screens/HomeScreen.kt
          git show 1c18498f9ad70b914e460ee8ae95dbba06ab8bc6:"$HS" > "$HS"

          python3 << 'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/com/metrolist/music/ui/screens/HomeScreen.kt')
          text = path.read_text()

          old = '            if (!chipActive && speedDialItems.isNotEmpty()) list.add(HomeSection.SpeedDial)\n'
          new = '            // Speed Dial removed in favor of ArchiveTune-style Quick Picks\n            // if (!chipActive && speedDialItems.isNotEmpty()) list.add(HomeSection.SpeedDial)\n'
          if old not in text:
              raise SystemExit('speed dial line not found')
          text = text.replace(old, new, 1)

          start = text.find('                                item(key = "quick_picks_list") {')
          if start < 0:
              raise SystemExit('quick_picks_list not found')
          end = text.find('                        HomeSection.FromTheCommunity -> {', start)
          if end < 0:
              raise SystemExit('FromTheCommunity not found')

          before, after = text[:start], text[end:]
          replacement = '''                                item(key = "quick_picks_list") {
                                    // ArchiveTune-style large horizontal Quick Picks cards
                                    LazyRow(
                                        contentPadding = PaddingValues(horizontal = 16.dp),
                                        horizontalArrangement = Arrangement.spacedBy(14.dp),
                                        modifier = Modifier.fillMaxWidth(),
                                    ) {
                                        items(
                                            items = quickPicks.distinctBy { it.id },
                                            key = { "home_quickpick_${it.id}" },
                                        ) { originalSong ->
                                            val song by database
                                                .song(originalSong.id)
                                                .collectAsStateWithLifecycle(initialValue = originalSong)
                                            val display = song ?: originalSong

                                            Box(
                                                modifier =
                                                    Modifier
                                                        .width(280.dp)
                                                        .height(320.dp)
                                                        .clip(RoundedCornerShape(24.dp))
                                                        .combinedClickable(
                                                            onClick = {
                                                                if (!isListenTogetherGuest) {
                                                                    playerConnection.playQueue(
                                                                        if (autoRadioQueue) {
                                                                            YouTubeQueue.radio(display.toMediaMetadata())
                                                                        } else {
                                                                            ListQueue(
                                                                                title = display.title,
                                                                                items = listOf(display.toMediaItem()),
                                                                            )
                                                                        },
                                                                    )
                                                                }
                                                            },
                                                            onLongClick = {
                                                                haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                                                menuState.show {
                                                                    SongMenu(
                                                                        originalSong = display,
                                                                        onDismiss = menuState::dismiss,
                                                                    )
                                                                }
                                                            },
                                                        ),
                                            ) {
                                                AsyncImage(
                                                    model = display.thumbnailUrl?.resize(800, 800),
                                                    contentDescription = null,
                                                    contentScale = ContentScale.Crop,
                                                    modifier = Modifier.fillMaxSize(),
                                                )
                                                Box(
                                                    modifier =
                                                        Modifier
                                                            .fillMaxSize()
                                                            .background(
                                                                Brush.verticalGradient(
                                                                    colors =
                                                                        listOf(
                                                                            Color.Transparent,
                                                                            Color.Black.copy(alpha = 0.75f),
                                                                        ),
                                                                ),
                                                            ),
                                                )
                                                Column(
                                                    modifier =
                                                        Modifier
                                                            .align(Alignment.BottomStart)
                                                            .padding(16.dp),
                                                ) {
                                                    Text(
                                                        text = display.title,
                                                        style = MaterialTheme.typography.titleLarge,
                                                        color = Color.White,
                                                        maxLines = 2,
                                                        overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis,
                                                    )
                                                    Text(
                                                        text = display.artists.joinToArtistString(" • ") { it.name },
                                                        style = MaterialTheme.typography.bodyMedium,
                                                        color = Color.White.copy(alpha = 0.85f),
                                                        maxLines = 1,
                                                        overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis,
                                                    )
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }

'''
          path.write_text(before + replacement + after)
          print('patched', path.stat().st_size)
          PY

      - name: Commit and push to rebrand/prismtune
        run: |
          git config user.name "PrismTune Bot"
          git config user.email "bot@prismtune.local"
          git add app/src/main/kotlin/com/metrolist/music/ui/screens/HomeScreen.kt
          git status
          git commit -m "ui: remove Speed Dial; ArchiveTune-style large Quick Picks cards" || echo "nothing to commit"
          git push origin HEAD:rebrand/prismtune
