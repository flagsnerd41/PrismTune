name: PrismTune APK (Manual Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/prismtune
          fetch-depth: 0

      - name: Restore HomeScreen + UI polish
        run: |
          set -e
          git fetch origin main
          git show origin/main:.github/scripts/patch_homescreen.py > /tmp/patch_homescreen.py
          python3 /tmp/patch_homescreen.py

          ABOUT=app/src/main/kotlin/com/metrolist/music/ui/screens/settings/AboutScreen.kt
          git show 25fbc45eccc81f60223be40ff96126dc2aae7c87:"$ABOUT" > "$ABOUT"
          sed -i \
            -e 's|https://github.com/MetrolistGroup/Metrolist/blob/main/LICENSE|https://github.com/flagsnerd41/PrismTune2/blob/main/LICENSE|g' \
            -e 's|https://github.com/MetrolistGroup/Metrolist|https://github.com/flagsnerd41/PrismTune2|g' \
            "$ABOUT"

          MP=app/src/main/kotlin/com/metrolist/music/ui/player/MiniPlayer.kt
          sed -i \
            -e 's/defaultValue = MiniPlayerBackgroundStyle.DEFAULT/defaultValue = MiniPlayerBackgroundStyle.BLUR/' \
            -e 's/Color.Black.copy(alpha = 0.45f)/Color.Black.copy(alpha = 0.32f)/' \
            "$MP"

          echo "OK polish"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/prismtune-release.jks" \
            -storepass android \
            -alias prismtune \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PrismTune,O=PrismTune,C=US"

      - name: Build signed FOSS Release APK
        run: |
          ./gradlew --console=plain assembleFossRelease \
            --warning-mode summary -x lint -x lintFossRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/prismtune-release.jks" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=prismtune \
            -Pandroid.injected.signing.key.password=android
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music.test
          METROLIST_APP_NAME: PrismTune
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Collect APK
        run: |
          set -e
          OUT="app/build/outputs/apk/foss/release/out"
          mkdir -p "$OUT"
          APK=$(find app/build/outputs/apk/foss/release -name "*.apk" ! -name "*-unsigned.apk" | head -1)
          echo "Found: $APK"
          test -n "$APK"
          cp "$APK" "$OUT/PrismTune-release.apk"
          ls -la "$OUT"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismTune-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
