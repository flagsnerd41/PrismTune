name: PrismTune APK (Manual Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/prismtune
          fetch-depth: 0

      - name: Patch HomeScreen (no Speed Dial, large Quick Picks)
        run: |
          git fetch origin main
          git show origin/main:.github/scripts/patch_homescreen.py > /tmp/patch_homescreen.py
          python3 /tmp/patch_homescreen.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music
          METROLIST_APP_NAME: PrismTune
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign and zipalign release APK
        run: |
          set -e
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"

          keytool -genkeypair -v \
            -keystore test-release.keystore \
            -storepass android \
            -alias prismtune \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PrismTune,O=PrismTune,C=US"

          UNSIGNED=$(find "$OUTPUT_DIR" -name "*.apk" ! -name "*-signed.apk" ! -name "*-aligned.apk" | head -1)
          echo "Unsigned: $UNSIGNED"
          test -n "$UNSIGNED"

          ZIPALIGN=$(find "$ANDROID_HOME" -name zipalign 2>/dev/null | head -1)
          APSIGNER=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1)

          ALIGNED="$OUTPUT_DIR/app-aligned.apk"
          SIGNED="$OUTPUT_DIR/out/PrismTune-release.apk"

          if [ -n "$ZIPALIGN" ] && [ -n "$APSIGNER" ]; then
            "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$APSIGNER" sign \
              --ks test-release.keystore \
              --ks-pass pass:android \
              --ks-key-alias prismtune \
              --key-pass pass:android \
              --out "$SIGNED" \
              "$ALIGNED"
          else
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore test-release.keystore \
              -storepass android -keypass android \
              "$UNSIGNED" prismtune
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -f 4 "$UNSIGNED" "$SIGNED"
            else
              cp "$UNSIGNED" "$SIGNED"
            fi
          fi

          ls -la "$OUTPUT_DIR/out"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismTune-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
