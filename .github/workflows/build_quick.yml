name: PrismTune APK (Manual Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build PrismTune APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music.test
          METROLIST_APP_NAME: PrismTune Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Prepare APK for upload
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          # Prefer any already-signed APK, otherwise take the unsigned one
          if ls "$OUTPUT_DIR"/*-signed.apk 1>/dev/null 2>&1; then
            find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1 | xargs -I{} cp {} "$OUTPUT_DIR/out/PrismTune-test.apk"
          else
            find "$OUTPUT_DIR" -name "*.apk" | head -1 | xargs -I{} cp {} "$OUTPUT_DIR/out/PrismTune-test-unsigned.apk"
          fi
          ls -la "$OUTPUT_DIR/out"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PrismTune-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
