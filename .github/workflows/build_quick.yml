name: PrismTune APK (Manual Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/prismtune
          fetch-depth: 0

      - name: Restore HomeScreen if broken
        run: |
          set -e
          HS="app/src/main/kotlin/com/metrolist/music/ui/screens/HomeScreen.kt"
          SIZE=$(wc -c < "$HS" || echo 0)
          if [ "$SIZE" -lt 1000 ]; then
            echo "HomeScreen broken ($SIZE bytes) - restoring from good commit"
            git show 1c18498f9ad70b914e460ee8ae95dbba06ab8bc6:"$HS" > "$HS"
          fi
          wc -c "$HS"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music.test
          METROLIST_APP_NAME: PrismTune Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign release APK
        run: |
          set -e
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"

          keytool -genkeypair -v \
            -keystore test-release.keystore \
            -storepass android \
            -alias prismtune \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PrismTune Test,O=PrismTune,C=US"

          UNSIGNED=$(find "$OUTPUT_DIR" -name "*.apk" ! -name "*-signed.apk" | head -1)
          echo "Unsigned: $UNSIGNED"

          APSIGNER=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1)
          if [ -n "$APSIGNER" ]; then
            "$APSIGNER" sign \
              --ks test-release.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT_DIR/out/PrismTune-release.apk" \
              "$UNSIGNED"
          else
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore test-release.keystore \
              -storepass android -keypass android \
              "$UNSIGNED" prismtune
            cp "$UNSIGNED" "$OUTPUT_DIR/out/PrismTune-release.apk"
          fi

          ls -la "$OUTPUT_DIR/out"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismTune-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
