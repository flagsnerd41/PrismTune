name: PrismTune APK (Manual Build)

# Build the optimized PrismTune test APK on pushes to the feature branch or manually.
on:
  workflow_dispatch:
  push:
    branches:
      - prism/liquid-glass-redesign

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # This is an optimized, non-debuggable test build. The temporary key is
      # for local testing only and must not be reused as a production release key.
      - name: Create temporary performance-test keystore
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v -keystore app/keystore/release.keystore -storepass android -alias prismtuneperf -keypass android -dname "CN=PrismTune Performance Test,O=PrismTune,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build optimized PrismTune performance APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music.perf
          METROLIST_APP_NAME: PrismTune
          STORE_PASSWORD: android
          KEY_ALIAS: prismtuneperf
          KEY_PASSWORD: android
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload optimized PrismTune APK
        uses: actions/upload-artifact@v7
        with:
          name: PrismTune-APK
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
