name: PrismTune APK (Manual Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build PrismTune APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music.test
          METROLIST_APP_NAME: PrismTune Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Generate debug keystore and sign APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"

          # Create a temporary debug keystore
          keytool -genkeypair -v \
            -keystore debug-test.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PrismTune Test,O=PrismTune,C=US"

          # Find the unsigned APK
          UNSIGNED=$(find "$OUTPUT_DIR" -name "*.apk" ! -name "*-signed.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED"

          # Align + sign with apksigner (from Android build-tools via sdkmanager if needed)
          # Use jarsigner as fallback if apksigner not available
          if command -v apksigner >/dev/null 2>&1; then
            apksigner sign \
              --ks debug-test.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT_DIR/out/PrismTune-test.apk" \
              "$UNSIGNED"
          else
            # Install Android cmdline tools for apksigner if missing
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
            if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/apksigner" ]; then
              "$BUILD_TOOLS/apksigner" sign \
                --ks debug-test.keystore \
                --ks-pass pass:android \
                --key-pass pass:android \
                --out "$OUTPUT_DIR/out/PrismTune-test.apk" \
                "$UNSIGNED"
            else
              # jarsigner fallback
              cp "$UNSIGNED" "$OUTPUT_DIR/out/PrismTune-test-unsigned.apk"
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore debug-test.keystore \
                -storepass android -keypass android \
                "$OUTPUT_DIR/out/PrismTune-test-unsigned.apk" androiddebugkey
              mv "$OUTPUT_DIR/out/PrismTune-test-unsigned.apk" "$OUTPUT_DIR/out/PrismTune-test.apk"
            fi
          fi

          ls -la "$OUTPUT_DIR/out"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PrismTune-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
