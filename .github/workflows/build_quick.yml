name: PrismTune APK (Manual Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/prismtune
          fetch-depth: 0

      - name: Restore HomeScreen + apply UI patch
        run: |
          set -e
          HS=app/src/main/kotlin/com/metrolist/music/ui/screens/HomeScreen.kt
          # Restore last known-good full file if current is broken
          if [ ! -s "$HS" ] || [ "$(wc -c < "$HS")" -lt 1000 ]; then
            git show 1c18498f9ad70b914e460ee8ae95dbba06ab8bc6:"$HS" > "$HS"
          fi
          # If still missing Speed Dial hide + large Quick Picks, re-apply from good base
          if ! grep -q 'ArchiveTune-style large horizontal Quick Picks' "$HS" 2>/dev/null; then
            git show 1c18498f9ad70b914e460ee8ae95dbba06ab8bc6:"$HS" > "$HS"
            python3 << 'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/com/metrolist/music/ui/screens/HomeScreen.kt')
          text = path.read_text()
          old = '            if (!chipActive && speedDialItems.isNotEmpty()) list.add(HomeSection.SpeedDial)\n'
          new = '            // Speed Dial removed in favor of ArchiveTune-style Quick Picks\n            // if (!chipActive && speedDialItems.isNotEmpty()) list.add(HomeSection.SpeedDial)\n'
          if old in text:
              text = text.replace(old, new, 1)
          start = text.find('                                item(key = "quick_picks_list") {')
          end = text.find('                        HomeSection.FromTheCommunity -> {', start) if start >= 0 else -1
          if start >= 0 and end >= 0:
              before, after = text[:start], text[end:]
              replacement = '''                                item(key = "quick_picks_list") {
                                    // ArchiveTune-style large horizontal Quick Picks cards
                                    LazyRow(
                                        contentPadding = PaddingValues(horizontal = 16.dp),
                                        horizontalArrangement = Arrangement.spacedBy(14.dp),
                                        modifier = Modifier.fillMaxWidth(),
                                    ) {
                                        items(
                                            items = quickPicks.distinctBy { it.id },
                                            key = { "home_quickpick_${it.id}" },
                                        ) { originalSong ->
                                            val song by database
                                                .song(originalSong.id)
                                                .collectAsStateWithLifecycle(initialValue = originalSong)
                                            val display = song ?: originalSong

                                            Box(
                                                modifier =
                                                    Modifier
                                                        .width(280.dp)
                                                        .height(320.dp)
                                                        .clip(RoundedCornerShape(24.dp))
                                                        .combinedClickable(
                                                            onClick = {
                                                                if (!isListenTogetherGuest) {
                                                                    playerConnection.playQueue(
                                                                        if (autoRadioQueue) {
                                                                            YouTubeQueue.radio(display.toMediaMetadata())
                                                                        } else {
                                                                            ListQueue(
                                                                                title = display.title,
                                                                                items = listOf(display.toMediaItem()),
                                                                            )
                                                                        },
                                                                    )
                                                                }
                                                            },
                                                            onLongClick = {
                                                                haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                                                                menuState.show {
                                                                    SongMenu(
                                                                        originalSong = display,
                                                                        onDismiss = menuState::dismiss,
                                                                    )
                                                                }
                                                            },
                                                        ),
                                            ) {
                                                AsyncImage(
                                                    model = display.thumbnailUrl?.resize(800, 800),
                                                    contentDescription = null,
                                                    contentScale = ContentScale.Crop,
                                                    modifier = Modifier.fillMaxSize(),
                                                )
                                                Box(
                                                    modifier =
                                                        Modifier
                                                            .fillMaxSize()
                                                            .background(
                                                                Brush.verticalGradient(
                                                                    colors =
                                                                        listOf(
                                                                            Color.Transparent,
                                                                            Color.Black.copy(alpha = 0.75f),
                                                                        ),
                                                                ),
                                                            ),
                                                )
                                                Column(
                                                    modifier =
                                                        Modifier
                                                            .align(Alignment.BottomStart)
                                                            .padding(16.dp),
                                                ) {
                                                    Text(
                                                        text = display.title,
                                                        style = MaterialTheme.typography.titleLarge,
                                                        color = Color.White,
                                                        maxLines = 2,
                                                        overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis,
                                                    )
                                                    Text(
                                                        text = display.artists.joinToArtistString(" • ") { it.name },
                                                        style = MaterialTheme.typography.bodyMedium,
                                                        color = Color.White.copy(alpha = 0.85f),
                                                        maxLines = 1,
                                                        overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis,
                                                    )
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }

'''
              path.write_text(before + replacement + after)
          print('HomeScreen size', path.stat().st_size)
          PY
          fi
          wc -c "$HS"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Release APK (optimized)
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music.test
          METROLIST_APP_NAME: PrismTune Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign release APK with generated keystore
        run: |
          set -e
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"

          keytool -genkeypair -v \
            -keystore test-release.keystore \
            -storepass android \
            -alias prismtune \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PrismTune Test,O=PrismTune,C=US"

          UNSIGNED=$(find "$OUTPUT_DIR" -name "*.apk" ! -name "*-signed.apk" | head -1)
          echo "Unsigned: $UNSIGNED"

          # Prefer apksigner from Android SDK
          APSIGNER=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1)
          if [ -n "$APSIGNER" ]; then
            "$APSIGNER" sign \
              --ks test-release.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT_DIR/out/PrismTune-release.apk" \
              "$UNSIGNED"
          else
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore test-release.keystore \
              -storepass android -keypass android \
              "$UNSIGNED" prismtune
            cp "$UNSIGNED" "$OUTPUT_DIR/out/PrismTune-release.apk"
          fi

          ls -la "$OUTPUT_DIR/out"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismTune-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
