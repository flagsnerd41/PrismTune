name: PrismTune APK (Manual Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Build PrismTune Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/prismtune
          fetch-depth: 0

      - name: Restore HomeScreen if broken
        run: |
          set -e
          HS="app/src/main/kotlin/com/metrolist/music/ui/screens/HomeScreen.kt"
          SIZE=$(wc -c < "$HS" || echo 0)
          if [ "$SIZE" -lt 1000 ]; then
            echo "HomeScreen broken ($SIZE bytes) - restoring from good commit"
            git show 1c18498f9ad70b914e460ee8ae95dbba06ab8bc6:"$HS" > "$HS"
          fi
          wc -c "$HS"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.prismtune.music.test
          METROLIST_APP_NAME: PrismTune Testing
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Install Android build-tools (zipalign + apksigner)
        run: |
          set -e
          # GitHub runners usually have Android SDK; install build-tools if needed
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p "$ANDROID_HOME/cmdline-tools"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Prefer existing tools
          if ! find "$ANDROID_HOME" -name zipalign 2>/dev/null | grep -q .; then
            CMDTOOLS=$(find "$ANDROID_HOME" -path "*/cmdline-tools/*/bin/sdkmanager" 2>/dev/null | head -1)
            if [ -n "$CMDTOOLS" ]; then
              yes | "$CMDTOOLS" --sdk_root="$ANDROID_HOME" "build-tools;34.0.0" || true
            fi
          fi
          find "$ANDROID_HOME" -name zipalign 2>/dev/null | head -3
          find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -3

      - name: Sign and zipalign release APK
        run: |
          set -e
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"

          keytool -genkeypair -v \
            -keystore test-release.keystore \
            -storepass android \
            -alias prismtune \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PrismTune Test,O=PrismTune,C=US"

          UNSIGNED=$(find "$OUTPUT_DIR" -name "*.apk" ! -name "*-signed.apk" ! -name "*-aligned.apk" | head -1)
          echo "Unsigned: $UNSIGNED"
          test -n "$UNSIGNED"

          ZIPALIGN=$(find "$ANDROID_HOME" -name zipalign 2>/dev/null | head -1)
          APSIGNER=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1)

          ALIGNED="$OUTPUT_DIR/app-aligned.apk"
          SIGNED="$OUTPUT_DIR/out/PrismTune-release.apk"

          if [ -n "$ZIPALIGN" ] && [ -n "$APSIGNER" ]; then
            echo "Using zipalign=$ZIPALIGN"
            echo "Using apksigner=$APSIGNER"
            # apksigner requires zipalign BEFORE signing
            "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
            "$APSIGNER" sign \
              --ks test-release.keystore \
              --ks-pass pass:android \
              --ks-key-alias prismtune \
              --key-pass pass:android \
              --out "$SIGNED" \
              "$ALIGNED"
            "$APSIGNER" verify --verbose "$SIGNED" || true
          else
            echo "WARNING: zipalign/apksigner missing — jarsigner + zipalign fallback"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore test-release.keystore \
              -storepass android -keypass android \
              "$UNSIGNED" prismtune
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -f 4 "$UNSIGNED" "$SIGNED"
            else
              cp "$UNSIGNED" "$SIGNED"
            fi
          fi

          ls -la "$OUTPUT_DIR/out"
          file "$SIGNED"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismTune-universal-test-release
          path: app/build/outputs/apk/foss/release/out/*
